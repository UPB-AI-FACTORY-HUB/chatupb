services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    env_file:
      - .env
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      WEBUI_SECRET_KEY: df8c429501a7baaf97c21da3da1f6c3bfd81deed20be79a38e5e329a0c05668c
      # Local Whisper STT, Spanish — see docs/speech-to-text.md
      AUDIO_STT_ENGINE: ""
      WHISPER_LANGUAGE: es
      WHISPER_MODEL: small
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - shared-net

volumes:
  open-webui: {}

networks:
  shared-net:
    external: true
